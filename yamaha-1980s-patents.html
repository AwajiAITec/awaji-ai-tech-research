<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>淡路島AI技術リサーチ</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --panel: #ffffff;
      --paper: #f6f8fa;
      --accent: #3ea8ff;
      --accent-dark: #0f83d8;
      --teal: #10b6b8;
      --amber: #f59e0b;
      --blue: #2563eb;
      --red: #e5484d;
      --shadow: 0 8px 24px rgba(31, 41, 55, .06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 16px 28px 14px;
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      max-width: 980px;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
    }

    .lang-switch {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #f3f7fb;
      flex: 0 0 auto;
    }

    .lang-switch button {
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #4b5563;
      padding: 7px 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .lang-switch button.active {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(62, 168, 255, .25);
    }

    .top-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #ffffff;
      color: #0f83d8;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    main {
      display: grid;
      grid-template-columns: minmax(250px, 300px) minmax(0, 1fr) minmax(300px, 370px);
      gap: 18px;
      padding: 18px;
      min-height: calc(100vh - 83px);
    }

    aside,
    .stage-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    aside {
      padding: 16px;
      overflow: auto;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 13px;
      color: #374151;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .model-list {
      display: grid;
      gap: 8px;
    }

    .model-button,
    .patent-button {
      width: 100%;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--ink);
      border-radius: 10px;
      padding: 11px 12px;
      text-align: left;
      cursor: pointer;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease, transform .15s ease;
    }

    .model-button:hover,
    .patent-button:hover {
      border-color: #9dd5ff;
      box-shadow: 0 8px 18px rgba(31, 41, 55, .08);
      transform: translateY(-1px);
    }

    .model-button.active,
    .patent-button.active {
      border-color: #8bd0ff;
      background: #f0f9ff;
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .model-name,
    .patent-no {
      display: block;
      font-weight: 700;
      font-size: 13px;
    }

    .model-meta,
    .patent-area {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .stage-panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }

    .stage-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff, #fbfdff);
    }

    .stage-title {
      min-width: 0;
    }

    .stage-title h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.35;
      font-weight: 800;
    }

    .stage-title p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      font-size: 12px;
      color: #4b5563;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      background: #f8fafc;
      border: 1px solid #edf2f7;
      border-radius: 999px;
      padding: 5px 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      background: var(--accent);
    }

    .dot.engine { background: var(--red); }
    .dot.chassis { background: var(--blue); }
    .dot.control { background: var(--teal); }
    .dot.design { background: var(--amber); }

    .stage {
      position: relative;
      flex: 1;
      min-height: 540px;
      background:
        radial-gradient(circle at 20% 15%, rgba(62, 168, 255, .08), transparent 30%),
        linear-gradient(90deg, rgba(31,41,55,.04) 1px, transparent 1px),
        linear-gradient(rgba(31,41,55,.04) 1px, transparent 1px),
        #fbfdff;
      background-size: auto, 30px 30px, 30px 30px, auto;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .bike-wrap {
      position: relative;
      width: min(92%, 980px);
      aspect-ratio: 16 / 10;
      display: grid;
      place-items: center;
    }

    .bike-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 10px;
      filter: drop-shadow(0 18px 24px rgba(31, 41, 55, .16));
    }

    .pin {
      position: absolute;
      transform: translate(-50%, -50%);
      border: 2px solid #fff;
      color: #fff;
      background: var(--red);
      border-radius: 999px;
      min-width: 88px;
      height: 32px;
      padding: 0 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 11px;
      box-shadow: 0 8px 18px rgba(31, 41, 55, .2);
      cursor: pointer;
      white-space: nowrap;
      transition: transform .15s ease, box-shadow .15s ease, outline-color .15s ease;
    }

    .pin.engine { background: var(--red); }
    .pin.chassis { background: var(--blue); }
    .pin.control { background: var(--teal); }
    .pin.design { background: var(--amber); }
    .pin.active {
      outline: 4px solid rgba(62, 168, 255, .28);
      transform: translate(-50%, -50%) scale(1.08);
      z-index: 4;
    }

    .detail {
      padding: 18px;
      overflow: auto;
    }

    .detail h2 {
      margin: 0 0 5px;
      font-size: 20px;
      line-height: 1.35;
      font-weight: 800;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 5px 10px;
      background: #e8f6ff;
      color: #0369a1;
      font-size: 12px;
      font-weight: 700;
    }

    .detail dl {
      display: grid;
      grid-template-columns: 82px 1fr;
      gap: 8px 10px;
      margin: 16px 0;
      font-size: 13px;
      line-height: 1.55;
    }

    .detail dt {
      color: var(--muted);
      font-weight: 700;
    }

    .detail dd {
      margin: 0;
    }

    .note {
      border-top: 1px solid var(--line);
      padding-top: 12px;
      color: #4b5563;
      font-size: 12px;
      line-height: 1.7;
    }

    .source-list {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      line-height: 1.7;
      color: #4b5563;
    }

    a {
      color: #0f83d8;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 980px) {
      main {
        grid-template-columns: 1fr;
      }

      .header-row {
        align-items: stretch;
        flex-direction: column;
      }

      .lang-switch {
        align-self: flex-start;
      }

      aside {
        max-height: none;
      }

      .stage {
        min-height: 430px;
        padding: 16px;
      }
    }

    @media (max-width: 560px) {
      header {
        padding: 14px 16px;
      }

      h1 {
        font-size: 20px;
      }

      main {
        padding: 10px;
        gap: 10px;
      }

      .stage-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .legend {
        justify-content: flex-start;
      }

      .stage {
        min-height: 350px;
      }

      .pin {
        min-width: 70px;
        height: 30px;
        font-size: 10px;
      }

      .detail dl {
        grid-template-columns: 74px 1fr;
      }
    }
  </style>
</head>

  <header>

            { label: "従属項で広がる範囲", children: [{ label: "具体的な取付位置" }, { label: "リンク形状またはブラケット形状" }, { label: "大型車・スポーツ車・ツアラーへの適用" }] }
          ],
          strengths: ["操縦安定性", "制動性能", "乗り心地", "整備性", "部品配置の合理化"]
        },
        control: {
          claimSummary: `${area}に関する検出・判断・操作系を組み合わせ、ライダーの操作負担を下げたり、車両状態の把握を容易にする制御/診断構成。`,
          claimTree: [
            { label: "独立請求項の中心", children: [{ label: "車両状態の検出" }, { label: "制御または診断処理" }, { label: "ライダーへの操作/表示インターフェース" }] },
            { label: "構成要素", children: [{ label: "センサーまたはスイッチ" }, { label: "制御回路" }, { label: "アクチュエータまたは表示部" }] },
            { label: "作用", children: [{ label: "設定値の維持" }, { label: "異常箇所の特定支援" }, { label: "長距離走行時の負担軽減" }] },
            { label: "従属項で広がる範囲", children: [{ label: "速度、スロットル、警告表示の条件" }, { label: "解除条件や安全側動作" }, { label: "ツアラーや高機能車への適用" }] }
          ],
          strengths: ["操作負担の低減", "安全側制御", "診断性", "高付加価値化", "ツアラー向け商品性"]
        }
      };

      const base = templates[patent.kind] || templates.chassis;
      return {
        claimSummary: base.claimSummary,
        claimTree: base.claimTree,
        strengths: base.strengths,
        products: currentProducts
      };
    }

    function renderPatent() {
      document.getElementById("patentTitle").textContent = activePatent.title;
      const number = Object.keys(patents).find(key => patents[key] === activePatent);
      document.getElementById("patentNumber").textContent = number;
      document.getElementById("patentArea").textContent = patentArea(number, activePatent);
      document.getElementById("patentPriority").textContent = activePatent.priority;
      document.getElementById("patentPublication").textContent = activePatent.publication;
      document.getElementById("patentAssignee").textContent = activePatent.assignee;
      document.getElementById("patentUse").textContent = patentUse(number, activePatent);
      document.getElementById("patentLink").href = activePatent.link;
      const sourceNote = currentLang === "en"
        ? "Note: component locations are mapped from collected patent content. Confirmed production adoption requires service manuals, parts lists, or official Yamaha technical documents."
        : "注: 部位表示は収集済み特許の内容からの関連付けです。実車への採用確定には、サービスマニュアル、部品表、Yamaha公式資料などでの追加確認が必要です。";
      document.getElementById("modelSource").innerHTML = `${modelCredit(activeModel)}<br>${sourceNote}`;
    }

    function render() {
      localizeStaticText();
      document.getElementById("modelTitle").textContent = activeModel.name;
      document.getElementById("modelSummary").textContent = `${activeModel.years} / ${modelSummary(activeModel)}`;
      bikeImage.src = activeModel.image;
      bikeImage.alt = `${activeModel.name} motorcycle`;
      bikeImage.onerror = () => {
        if (activeModel.fallbackImage && bikeImage.src !== activeModel.fallbackImage) {
          bikeImage.src = activeModel.fallbackImage;
        }
      };
      renderModels();
      renderPins();
      renderPatent();
      renderPatentList();
    }

    document.getElementById("langJa").addEventListener("click", () => {
      currentLang = "ja";
      render();
    });

    document.getElementById("langEn").addEventListener("click", () => {
      currentLang = "en";
      render();
    });

    render();
  </script>
</body>
</html>
